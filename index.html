<style>
:root{
  --display:'Cinzel','Trajan Pro','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif;
  --body:'Crimson Pro','Iowan Old Style','Palatino Linotype','Book Antiqua',Georgia,serif;
  --bg:#eadcbc; --bg2:#f3e8cc; --paper:#fbf5e3; --paper2:#f6ecd2; --ink:#2b1d14; --ink2:#5a4636; --mute:#8a7560;
  --wine:#7d2530; --wine2:#a7343b; --wine-d:#561820; --gold:#a98334; --gold2:#d4b06a;
  --line:#dccaa0; --line2:#c4ae80; --ok:#3f6b46; --warn:#a8641c; --bad:#a3262f;
  --shadow:0 1px 0 #fff9 inset,0 2px 10px #4a2f1a24;
  --tex:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='220' height='220'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .35 0 0 0 0 .25 0 0 0 0 .1 0 0 0 .10 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  --t-pg:#8f2d3a; --t-png:#3b5f8a; --t-luogo:#3f7a4a; --t-oggetto:#9a7022; --t-fazione:#6a4a8c; --t-missione:#b4541c; --t-lore:#5b6670;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#15100d; --bg2:#1c1511; --paper:#241b16; --paper2:#2b211b; --ink:#ecdfc6; --ink2:#c5b193; --mute:#94806a;
  --wine:#8c2c38; --wine2:#c4494f; --wine-d:#2c0f14; --gold:#c9a24b; --gold2:#e0c071;
  --line:#3a2d24; --line2:#55402f; --ok:#7bb383; --warn:#e0a05a; --bad:#e8707a;
  --shadow:0 1px 0 #ffffff0a inset,0 2px 12px #00000066;
  --tex:none;
  --t-pg:#c4606c; --t-png:#6f98c8; --t-luogo:#6fb27b; --t-oggetto:#cfa24f; --t-fazione:#a58bd0; --t-missione:#e08a52; --t-lore:#97a3ae;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at 15% 0%,#fff7 0,transparent 55%),radial-gradient(ellipse at 100% 100%,#7d253018 0,transparent 55%),var(--tex)}
:root[data-theme=dark] body::before{background:radial-gradient(ellipse at 15% 0%,#7d25301c 0,transparent 55%)}
a{color:var(--wine2);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;letter-spacing:.02em;margin:0;line-height:1.2;color:var(--wine)}
:root[data-theme=dark] h1,:root[data-theme=dark] h2,:root[data-theme=dark] h3{color:var(--gold2)}
h1{font-size:2rem} h2{font-size:1.35rem} h3{font-size:1.1rem} h4{font-size:1rem;margin:.9em 0 .2em}
small,.mute{color:var(--mute)}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:#a7343b44}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:18px;padding:0 20px;height:58px;
  background:linear-gradient(180deg,var(--wine) 0,var(--wine-d) 100%);color:#f5e6c4;border-bottom:3px double var(--gold2);box-shadow:0 3px 12px #0005}
.brand{display:flex;align-items:center;gap:10px;color:#f5e6c4;text-decoration:none!important;flex:none}
.brand svg{width:30px;height:30px}
.brand b{display:block;font-family:var(--display);letter-spacing:.14em;font-size:1.05rem;line-height:1}
.brand small{display:block;color:#e7cf9a;font-size:.78rem;line-height:1.1;margin-top:3px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#nav{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
#nav a{color:#f1dfb6;font-family:var(--display);font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;padding:8px 11px;border-radius:4px;white-space:nowrap;text-decoration:none}
#nav a:hover{background:#ffffff18}
#nav a.on{background:#00000040;color:#fff;box-shadow:inset 0 -2px 0 var(--gold2)}
.srch{position:relative;flex:none;width:230px}
.top .srch input[type=search]{width:100%;background:#00000030;color:#fff;padding:7px 12px;border-radius:20px;border:1px solid #ffffff40;background:#00000030;color:#fff;outline:none}
.srch input::placeholder{color:#e0cb9b}
.top .srch input[type=search]:focus{background:#00000055;border-color:var(--gold2);box-shadow:none}
#qres{position:absolute;right:0;top:42px;width:380px;max-width:92vw;background:var(--paper);color:var(--ink);border:1px solid var(--line2);border-radius:6px;box-shadow:0 10px 30px #0006;display:none;max-height:70vh;overflow:auto}
#qres.on{display:block}
#qres a{display:flex;gap:8px;align-items:center;padding:7px 12px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
#qres a:hover,#qres a.sel{background:var(--paper2)}
#qres .more{padding:7px 12px;font-size:.9rem;color:var(--mute)}
.iconbtn{background:#00000030;border:1px solid #ffffff30;color:#f5e6c4;width:34px;height:34px;border-radius:50%;cursor:pointer;flex:none;font-size:1rem}
.iconbtn:hover{background:#00000055}

/* ---------- layout ---------- */
main{position:relative;z-index:1}
.page{max-width:1020px;margin:0 auto;padding:26px 20px 90px}
.page.narrow{max-width:760px}
.pagehead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.pagehead h1{flex:1;min-width:200px}
.pagehead .acts{display:flex;gap:8px;flex-wrap:wrap}
.orn{height:14px;margin:6px 0 18px;background:linear-gradient(90deg,transparent,var(--gold) 20%,var(--gold) 46%,transparent 46%,transparent 54%,var(--gold) 54%,var(--gold) 80%,transparent);background-size:100% 1px;background-repeat:no-repeat;background-position:center;position:relative}
.orn::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;background:var(--gold);transform:translate(-50%,-50%) rotate(45deg);box-shadow:0 0 0 3px var(--bg)}
.card{background:var(--paper);border:1px solid var(--line2);border-radius:5px;padding:18px 22px;box-shadow:var(--shadow);position:relative;margin-bottom:18px}
.card::before{content:"";position:absolute;inset:4px;border:1px solid var(--line);border-radius:3px;pointer-events:none}
.card>*{position:relative}
.card h2{margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.empty{text-align:center;color:var(--mute);padding:34px 10px}
.hint{font-size:.9rem;color:var(--mute)}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:4px;border:1px solid var(--line2);background:var(--paper2);color:var(--ink);cursor:pointer;font-family:var(--display);font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;text-decoration:none!important;line-height:1.2}
.btn:hover{border-color:var(--gold);background:var(--paper)}
.btn.primary{background:linear-gradient(180deg,var(--wine2),var(--wine));color:#fbeccb;border-color:var(--wine-d);box-shadow:0 1px 0 #ffffff30 inset}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{background:var(--bad);color:#fff;border-color:#0004}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 9px;font-size:.7rem}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.on{background:var(--wine);color:#fbeccb;border-color:var(--wine-d)}
input[type=text],input[type=search],input[type=number],input[type=date],select,textarea,input:not([type]){width:100%;padding:8px 10px;border:1px solid var(--line2);border-radius:4px;background:var(--paper);outline:none}
textarea{resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--wine2);box-shadow:0 0 0 2px #a7343b33}
label.f{display:block;margin:0 0 12px}
label.f>span{display:block;font-family:var(--display);font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);margin-bottom:4px}
.fdrop{border:2px dashed var(--line2);border-radius:6px;padding:10px;background:var(--paper2)}
.fdrop input{width:100%}.fdrop .dz{display:block;margin-top:4px;color:var(--ink2)}
@media (hover:none){.fdrop{border:0;padding:0;background:none}.dz{display:none!important}}
.gallery.big{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.dropping{position:relative;outline:3px dashed var(--gold);outline-offset:-3px}
.dropping::after{content:attr(data-drop);position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:#2b1d14cc;color:#fbeccb;font-family:var(--display);font-size:1.05rem;letter-spacing:.05em;pointer-events:none;border-radius:inherit}
.dropping.dropfull::after{position:fixed}
.dropping.dropbar::after{inset:0 0 auto;padding:12px 18px;background:#2b1d14e6;border-radius:0}
.pin.droptgt{z-index:6;filter:drop-shadow(0 0 8px #ffd76a) drop-shadow(0 0 3px #ffd76a)}
label.chk{display:flex;gap:8px;align-items:center;margin:0 0 12px;cursor:pointer}
label.chk input{width:auto}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:4px;overflow:hidden}
.seg button{background:var(--paper2);border:0;padding:5px 11px;cursor:pointer;font-family:var(--display);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.seg button.on{background:var(--wine);color:#fbeccb}

.badge{display:inline-block;padding:1px 8px;border-radius:3px;font-family:var(--display);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--t-lore);white-space:nowrap;vertical-align:middle}
.badge.t-pg{background:var(--t-pg)}.badge.t-png{background:var(--t-png)}.badge.t-luogo{background:var(--t-luogo)}.badge.t-oggetto{background:var(--t-oggetto)}.badge.t-fazione{background:var(--t-fazione)}.badge.t-missione{background:var(--t-missione)}.badge.t-lore{background:var(--t-lore)}
:root[data-theme=dark] .badge{color:#16100c}
.pill{display:inline-block;padding:0 9px;border:1px solid var(--line2);border-radius:12px;font-size:.85rem;color:var(--ink2);background:var(--paper2)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
/* parti «Solo per DM»: il DM le vede evidenziate, ai giocatori non arrivano */
.pill.dm{color:#7a3d8a;border-color:#7a3d8a88;background:#7a3d8a14;font-family:var(--body);font-size:.75rem;letter-spacing:0;text-transform:none}
.dmonly{background:repeating-linear-gradient(135deg,#7a3d8a1c 0 6px,#7a3d8a0d 6px 12px);box-shadow:inset 0 -1px 0 #7a3d8a99;border-radius:3px;padding:0 2px}
.dmonly::before{content:'🔒';font-size:.75em;margin-right:2px}
.sec.dmsec>summary,.entry.dment .tx{opacity:.82}
.dmtool{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0 0}.dmtool small{color:var(--ink2)}
/* «Mostra a:» — parti che vedono solo alcuni giocatori */
.pill.vis{color:#2f6b5e;border-color:#2f6b5e88;background:#2f6b5e14;font-family:var(--body);font-size:.75rem;letter-spacing:0;text-transform:none}
.plonly{background:repeating-linear-gradient(135deg,#2f6b5e1c 0 6px,#2f6b5e0d 6px 12px);box-shadow:inset 0 -1px 0 #2f6b5e99;border-radius:3px;padding:0 2px}
.plonly::before{content:'👁';font-size:.75em;margin-right:2px}
fieldset.visf{border:1px solid var(--line2);border-radius:8px;padding:6px 10px 2px;margin:0 0 12px}fieldset.visf legend{padding:0 4px;color:var(--ink2);font-size:.9rem}
.visrow{display:flex;gap:4px 14px;flex-wrap:wrap;align-items:center}.visrow label{display:flex;gap:5px;align-items:center;cursor:pointer;margin:0 0 6px}
.dmtool .visrow{flex-basis:100%;padding:6px 8px;border:1px dashed #2f6b5e88;border-radius:8px}.dmtool .visrow b{font-weight:600;color:#2f6b5e;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border:1px solid var(--line2);border-radius:14px;background:var(--paper2);color:var(--ink);font-size:.92rem;text-decoration:none!important;cursor:pointer}
.chip:hover{border-color:var(--gold);background:var(--paper)}
.chip.on{background:var(--wine);color:#fbeccb;border-color:var(--wine-d)}
.chip em{font-style:normal;color:var(--mute);font-size:.82rem}
.chip.on em{color:#e9cf9a}
.chips{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- prose ---------- */
.prose p{margin:.55em 0}
.prose ul{margin:.5em 0;padding-left:1.4em}
.prose h4{color:var(--wine)}
.prose .xref{border-bottom:1px dotted var(--wine2)}
.prose .xref.dead{border-bottom:0;color:var(--ink2);font-style:italic}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lead{font-size:1.08rem}

/* ---------- lists ---------- */
.vl{position:relative;overflow:auto;background:var(--paper);border:1px solid var(--line2);border-radius:5px;box-shadow:var(--shadow)}
.vl-in{position:relative}
.vl-row{position:absolute;left:0;right:0}
.erow{display:flex;gap:12px;align-items:center;height:100%;padding:0 16px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none!important;cursor:pointer;overflow:hidden}
.erow:hover{background:var(--paper2)}
.erow .main{flex:1;min-width:0}
.erow .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erow .t small{font-weight:400}
.erow .b{color:var(--ink2);font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erow .r{flex:none;text-align:right;font-size:.85rem;color:var(--mute);max-width:200px}
.erow .num{flex:none;width:52px;font-family:var(--display);font-size:1.2rem;color:var(--wine);text-align:center}
:root[data-theme=dark] .erow .num{color:var(--gold2)}
.erow.ev{align-items:flex-start;padding-top:10px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters input[type=search]{max-width:260px}

/* ---------- entity page ---------- */
.ehead .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.ehead h1{margin:2px 0 4px}
.ehead .brief{font-style:italic;color:var(--ink2);font-size:1.12rem}
.sec{border-top:1px solid var(--line);padding:6px 0}
.sec:first-of-type{border-top:0}
.sec>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:6px 0;font-family:var(--display);color:var(--wine);letter-spacing:.04em;font-size:1.02rem}
:root[data-theme=dark] .sec>summary{color:var(--gold2)}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::before{content:"▸";color:var(--gold);transition:transform .15s}
.sec[open]>summary::before{transform:rotate(90deg)}
.sec>summary .cnt{font-size:.78rem;color:var(--mute);font-family:var(--body)}
.sec>summary .sp{flex:1}
.entry{display:flex;gap:12px;padding:6px 0 8px;position:relative}
.entry .tag{flex:none;width:64px;font-family:var(--display);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding-top:5px;text-align:right}
.entry .tag a{color:var(--mute)}
.entry .tx{flex:1;min-width:0}
.entry .tx .prose p:first-child{margin-top:0}
.entry .eacts{opacity:0;flex:none;display:flex;gap:4px;transition:opacity .15s}
.entry:hover .eacts,.entry:focus-within .eacts{opacity:1}
@media (hover:none){.entry .eacts{opacity:1}}
.icb{border:0;background:transparent;cursor:pointer;color:var(--mute);font-size:1rem;padding:2px 6px;border-radius:3px}
.icb:hover{background:var(--paper2);color:var(--wine2)}
.rel{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0}
.rel .lab{color:var(--mute);font-size:.9rem}

.stat{display:flex;gap:14px;flex-wrap:wrap}
.stat div{flex:1;min-width:110px;text-align:center;padding:10px 6px;border:1px solid var(--line);border-radius:4px;background:var(--paper2)}
.stat b{display:block;font-family:var(--display);font-size:1.6rem;color:var(--wine)}
:root[data-theme=dark] .stat b{color:var(--gold2)}
.stat span{font-size:.85rem;color:var(--mute)}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 16px;border:1px solid var(--warn);border-left-width:5px;border-radius:4px;background:var(--paper);margin-bottom:18px}
.banner.ok{border-color:var(--ok)}
.steps{counter-reset:s;list-style:none;padding:0;margin:8px 0}
.steps li{counter-increment:s;position:relative;padding:8px 0 8px 46px}
.steps li::before{content:counter(s);position:absolute;left:0;top:6px;width:32px;height:32px;border-radius:50%;background:var(--wine);color:#fbeccb;font-family:var(--display);display:flex;align-items:center;justify-content:center}
.arc{border-top:1px solid var(--line);padding:6px 0}
.arc>summary{cursor:pointer;font-family:var(--display);color:var(--wine);list-style:none}
:root[data-theme=dark] .arc>summary{color:var(--gold2)}
.arc>summary::-webkit-details-marker{display:none}
.arc>summary small{font-family:var(--body);margin-left:8px}
.arc>summary{overflow-wrap:anywhere}

/* ---------- import ---------- */
textarea.big{min-height:260px;font-family:ui-monospace,Consolas,monospace;font-size:.85rem}
.plan h3{margin:14px 0 6px}
.plan ul{margin:4px 0;padding-left:20px}
.plan .w{color:var(--warn)}
.plan .e{color:var(--bad)}
.plan li small{display:block}
.codebox{white-space:pre-wrap;font-family:ui-monospace,Consolas,monospace;font-size:.82rem;background:var(--paper2);border:1px solid var(--line);padding:10px;border-radius:4px;max-height:260px;overflow:auto}

/* ---------- dialog / toast ---------- */
dialog.dlg{border:1px solid var(--gold);border-radius:6px;padding:0;background:var(--paper);color:var(--ink);width:min(560px,94vw);box-shadow:0 20px 60px #000a;max-height:92vh}
dialog.dlg.wide{width:min(860px,96vw)}
dialog.dlg::backdrop{background:#150b0acc}
dialog.dlg form{padding:20px 24px;margin:0}
dialog.dlg h3{margin-bottom:12px}
dialog.dlg menu{display:flex;justify-content:flex-end;gap:8px;padding:0;margin:14px 0 0}
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--wine-d);color:#fbeccb;padding:9px 18px;border-radius:4px;border:1px solid var(--gold2);box-shadow:0 6px 20px #0008;transition:opacity .4s}
.toast.out{opacity:0}.toast.err{background:var(--bad)}

/* ---------- maps ---------- */
.maplist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.mapcard{display:block;background:var(--paper);border:1px solid var(--line2);border-radius:5px;overflow:hidden;box-shadow:var(--shadow);color:var(--ink);text-decoration:none!important}
.mapcard:hover{border-color:var(--gold);transform:translateY(-1px)}
.mapcard .im{height:140px;background:#2a2018 center/cover no-repeat}
.mapcard .tx{padding:10px 14px 12px}
.mapcard .tx b{font-family:var(--display);color:var(--wine);font-size:.95rem}

/* ---------- testo: markdown leggero + link [[id]] ---------- */
function findEnt(ref) {
  ref = String(ref || '').trim();

// [DM]testo[/DM]: frase visibile solo al DM (se manca la chiusura vale fino alla fine del testo)

const visNames = v => v.length ? v.map(id => PLAYERS().find(p => p[0] === id)?.[1] || id).join(', ') : 'nessun giocatore';
const visPill = o => !window.__RO && Array.isArray(o?.vis) ? ` <span class="pill vis" title="Mostra a: ${esc(visNames(o.vis))}">👁 ${esc(visNames(o.vis))}</span>` : '';

const PER_RE = /\[PER ([^\]]*)\]([\s\S]*?)(?:\[\/PER\]|$)/g;
const perLines = t => t.replace(PER_RE, (m, w, x) => x.split('\n').map(l => l.trim() ? '[PER ' + w + ']' + l + '[/PER]' : l).join('\n'));

/* formDlg: campi {k,label,type,value,options,rows,placeholder,hint,list,req} */

const MOBILE = matchMedia('(max-width:620px)');
function vlist(host, items, rowH, render) {
  host.classList.add('vl'); host.innerHTML = '<div class="vl-in"></div>';
  const inner = host.firstChild; let first = -1, last = -1, raf = 0;
  // sul telefono niente riquadro con lo scorrimento interno: righe nel flusso della pagina, alte quanto il testo
  const flow = () => MOBILE.matches && items.length <= 1500;
  const fit = () => { host.classList.toggle('flow', flow()); if (flow()) { host.style.height = ''; inner.style.height = ''; return; } const top = host.getBoundingClientRect().top; host.style.height = Math.max(300, innerHeight - top - 20) + 'px'; inner.style.height = items.length * rowH + 'px'; };
  function paint() {
    raf = 0;
    if (flow()) { first = last = -1; inner.innerHTML = items.map((it, i) => `<div class="vl-row">${render(it, i)}</div>`).join(''); return; }
    const top = host.scrollTop, h = host.clientHeight || 600;
    const a = Math.max(0, Math.floor(top / rowH) - 5), b = Math.min(items.length, Math.ceil((top + h) / rowH) + 5);
    if (a === first && b === last) return; first = a; last = b;
    let html = ''; for (let i = a; i < b; i++) html += `<div class="vl-row" style="top:${i * rowH}px;height:${rowH}px">${render(items[i], i)}</div>`;
    inner.innerHTML = html;
  }
  const onScroll = () => { if (!raf) raf = requestAnimationFrame(paint); };
  host.addEventListener('scroll', onScroll, { passive: true });
  const onResize = () => { fit(); first = -1; paint(); };
  addEventListener('resize', onResize); onCleanup(() => removeEventListener('resize', onResize));
  const api = {
    setItems(it) { items = it; fit(); host.scrollTop = 0; first = -1; paint(); },
    repaint() { first = -1; paint(); },
    scrollTo(i) { if (flow()) inner.children[i]?.scrollIntoView({ block: 'center' }); else host.scrollTop = i * rowH; }
  };
  fit(); paint();

  const ents = [...M.entities.values()], sess = [...M.sessions.values()], maps = [...M.maps.values()], meta = [...M.meta.values()];
  S.ents = new Map(); S.byName = new Map(); S.sidx = new Map();

    for (const n of [e.name, ...(e.alias || [])]) {
      const k = norm(n); if (!k) continue;

/* ---------- scritture a blocchi con registro di annullamento (in memoria) ---------- */
async function runBatch(stores, label, fn, { undo = false, extra = {}, reload = true } = {}) {
  const ops = [], wr = new Map(); // wr: "s|k" -> operazione finale da scrivere
  const prevOf = async (s, k) => lazy(s) ? await dbGet(s, k) : (s === 'blobs' ? cl(M.blobs.get(k)) : cl(M[s].get(k)));
  const b = {
    get: (s, k) => dbGet(s, k),
    idx: (s, i, k) => dbIdx(s, i, k),
    async put(s, v) {
      const k = keyOf(s, v), prev = await prevOf(s, k); ops.push({ s, k, prev });
      let rec = v; if (s === 'blobs') rec = v.blob ? await putBlobRec(v) : cl(v);
      wr.set(s + '|' + did(k), { s, k, v: cl(rec) });
    },
    async del(s, k) { const prev = await prevOf(s, k); if (prev !== undefined) { ops.push({ s, k, prev }); wr.set(s + '|' + did(k), { s, k, del: true }); } }
  };

  for (const o of list) { if (lazy(o.s)) continue; if (o.del) M[o.s].delete(o.k); else M[o.s].set(o.k, o.v); }
  try { await persist(list); }
  catch (e) { try { await resync(); } catch { } throw e; }

}

  const rec = IMPORTS[IMPORTS.length - 1]; if (!rec) throw new Error('Niente da annullare (il registro di annullamento vale solo finché la pagina resta aperta)');
  const list = [];
  for (const o of [...rec.ops].reverse()) list.push(o.prev === undefined ? { s: o.s, k: o.k, del: true } : { s: o.s, k: o.k, v: o.prev });
  for (const o of list) { if (lazy(o.s)) continue; if (o.del) M[o.s].delete(o.k); else M[o.s].set(o.k, cl(o.v)); }
  await persist(list); IMPORTS.pop(); await loadCaches();
}

/* ---------- import: lettura tollerante ---------- */
function parseLoose(raw) {
  let t = String(raw || '').trim();
  const f = t.match(/```(?:json)?\s*([\s\S]*?)```/i); if (f) t = f[1].trim();
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a) t = t.slice(a, b + 1);
  try { return JSON.parse(t); }
  catch (e1) { try { return JSON.parse(t.replace(/,\s*([}\]])/g, '$1')); } catch { throw e1; } }
}

const BK_STORES = ['meta', 'entities', 'bodies', 'sessions', 'sbodies', 'events', 'maps', 'pins', 'links', 'regions'];
const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); });
function dataURLtoBlob(u) { const [h, d] = u.split(','); const mime = h.match(/:(.*?);/)[1]; const bin = atob(d); const a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], { type: mime }); }
async function buildBackup(withImages) {
  const data = {}; for (const st of BK_STORES) data[st] = await dbAll(st);
  const parts = ['{"formato":"cronache-backup/1","ts":' + Date.now() + ',"stores":', JSON.stringify(data)];
  if (withImages) {
    const blobs = await dbAll('blobs'); parts.push(',"blobs":[');
    for (let i = 0; i < blobs.length; i++) { const r = await dbGet('blobs', blobs[i].id).catch(() => null); if (!r) continue; parts.push((i ? ',' : '') + JSON.stringify({ id: r.id, type: r.type, data: await blobToDataURL(r.blob) })); }
    parts.push(']');
  }
  parts.push('}'); return new Blob(parts, { type: 'application/json' });
}
async function download(blob, name) {
  const dl = await claude.use('downloads'); if (!dl) throw new Error('Il salvataggio di file non è disponibile qui.');
  try { await dl.save({ filename: name, data: blob }); } catch (e) { if (e && e.code === 'declined') return; throw new Error(e.message || 'Salvataggio non riuscito'); }
}
const stamp = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`; };
async function doBackup(withImages) {

async function restoreBackup(text) {
  let j; try { j = JSON.parse(text); } catch (e) { throw new Error('File non valido: ' + e.message); }
  if (j.formato !== 'cronache-backup/1' || !j.stores) throw new Error('Questo non sembra un backup di Campagna D&D.');
  await wipeAll(true);
  const ops = []; for (const st of BK_STORES) for (const r of j.stores[st] || []) ops.push({ s: st, k: r[KEYP[st]], v: r });
  if (j.blobs) for (const bl of j.blobs) { const blob = dataURLtoBlob(bl.data); ops.push({ s: 'blobs', k: bl.id, v: await putBlobRec({ id: bl.id, blob, type: bl.type || blob.type }) }); }
  for (const o of ops) if (!lazy(o.s)) M[o.s].set(o.k, o.v);
  await persist(ops); await loadCaches();

}
async function wipeAll(keepBlobs) {
  const st = STORES.filter(x => !(keepBlobs && x === 'blobs')); const ops = [];
  for (const x of st) { if (lazy(x)) { for (const d of (await colOf(x).get()).docs) ops.push({ s: x, k: d.id, del: true }); } else { for (const k of M[x].keys()) ops.push({ s: x, k, del: true }); M[x].clear(); } }

}

async function loadBitmap(file) {
  if (window.createImageBitmap) { try { return await createImageBitmap(file); } catch { } }
  return await new Promise((res, rej) => { const u = URL.createObjectURL(file), im = new Image(); im.onload = () => { res(im); }; im.onerror = () => rej(new Error('Immagine non leggibile')); im.src = u; });
}
const canvasBlob = (c, type, q) => new Promise(r => c.toBlob(r, type, q));
async function processImage(file, MAX = 4096) {
  if (!file.type) { const x = (file.name || '').toLowerCase().split('.').pop(); const t = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', jfif: 'image/jpeg', webp: 'image/webp', gif: 'image/gif', bmp: 'image/bmp' }[x]; if (t) file = new File([file], file.name, { type: t }); }
  if (!/^image\/(png|jpe?g|webp|gif|bmp)$/i.test(file.type)) throw new Error('Formato non supportato: usa PNG, JPG o WebP.');
  // la memoria delle immagini decodificate e delle tele va liberata subito: su iPhone/iPad il limite è basso
  // e, se si accumula, dopo poche foto il browser smette di elaborarle
  const bmp = await loadBitmap(file), free = c => { c.width = c.height = 0; };
  try {
    const w = bmp.width, h = bmp.height;
    let blob = file, W = w, H = h;
    const keep = file.size <= 5 * 1048576 && Math.max(w, h) <= MAX && /^image\/(png|jpe?g|webp)$/i.test(file.type);
    if (!keep) {
      const s = Math.min(1, MAX / Math.max(w, h)); W = Math.round(w * s); H = Math.round(h * s);
      const c = document.createElement('canvas'); c.width = W; c.height = H; c.getContext('2d').drawImage(bmp, 0, 0, W, H);
      blob = await canvasBlob(c, 'image/webp', 0.92); if (!blob || blob.type !== 'image/webp') blob = await canvasBlob(c, 'image/jpeg', 0.9);
      free(c);
      if (!blob) throw new Error('Il browser non è riuscito a elaborare l\'immagine: ricarica la pagina e riprova.');
    }
    const ts = 360 / Math.max(W, 1), tc = document.createElement('canvas'); tc.width = Math.min(360, W); tc.height = Math.max(1, Math.round(H * Math.min(1, ts)));
    tc.getContext('2d').drawImage(bmp, 0, 0, tc.width, tc.height);
    const thumb = tc.toDataURL('image/jpeg', 0.7); free(tc);
    return { blob, w: W, h: H, thumb, shrunk: !keep };
  } finally { if (bmp.close) bmp.close(); else if (bmp.src) URL.revokeObjectURL(bmp.src); }
}

/* ---------- lettura .docx (zip + deflate nativo, offline) ---------- */
async function docxText(file) {
  const buf = new Uint8Array(await file.arrayBuffer()), dv = new DataView(buf.buffer);
  let e = buf.length - 22; while (e >= 0 && !(buf[e] === 0x50 && buf[e + 1] === 0x4b && buf[e + 2] === 5 && buf[e + 3] === 6)) e--;
  if (e < 0) throw new Error('File .docx non valido');
  const cnt = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true); const dec = new TextDecoder();
  for (let i = 0; i < cnt; i++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true), nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), lho = dv.getUint32(p + 42, true);
    const name = dec.decode(buf.subarray(p + 46, p + 46 + nlen));
    if (name === 'word/document.xml') {
      const start = lho + 30 + dv.getUint16(lho + 26, true) + dv.getUint16(lho + 28, true); const data = buf.slice(start, start + csize);
      let xml; if (method === 0) xml = dec.decode(data);
      else { if (typeof DecompressionStream === 'undefined') throw new Error('Il browser non supporta la lettura dei .docx: incolla il testo.'); xml = await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text(); }
      return xml.replace(/<w:tab\/>/g, '\t').replace(/<w:br[^>]*\/>/g, '\n').replace(/<\/w:p>/g, '\n').replace(/<[^>]+>/g, '')
        .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, '&').replace(/\n{3,}/g, '\n\n').trim();
    }
    p += 46 + nlen + xlen + clen;
  }
  throw new Error('Nel .docx non ho trovato il testo.');
}
async function readTextFile(file) {
  const n = file.name.toLowerCase();
  if (n.endsWith('.docx')) return await docxText(file);
  if (n.endsWith('.pdf')) throw new Error('I PDF non si leggono offline: apri il PDF, copia il testo e incollalo.');
  if (n.endsWith('.doc')) throw new Error('Il vecchio formato .doc non è supportato: salvalo come .docx o incolla il testo.');
  return (await file.text()).trim();
}

async function copyContextFlow() {

async function deleteEntity(id) {
  const [outL, inL, evs, pins] = await Promise.all([dbIdx('links', 'from', id), dbIdx('links', 'to', id), dbIdx('events', 'ents', id), dbIdx('pins', 'entityId', id)]);
  const photos = S.ents.get(id)?.photos || [];
  await runBatch(['entities', 'bodies', 'links', 'events', 'pins', 'blobs'], '', async t => {
    await t.del('entities', id); await t.del('bodies', id); await t.del('blobs', 'portrait-' + id);
    for (const ph of photos) for (const x of phIds(ph)) await t.del('blobs', x);
    for (const l of [...outL, ...inL]) await t.del('links', l.k);
    for (const p of pins) { await t.del('pins', p.id); for (const ph of p.photos || []) for (const x of phIds(ph)) await t.del('blobs', x); }
    for (const v of evs) await t.put('events', { ...v, ents: v.ents.filter(x => x !== id) });
  });
}
async function mergeEntity(src, dst) {
  const [sb, db_, outL, inL, evs, pins] = await Promise.all([dbGet('bodies', src), dbGet('bodies', dst), dbIdx('links', 'from', src), dbIdx('links', 'to', src), dbIdx('events', 'ents', src), dbIdx('pins', 'entityId', src)]);
  const s = S.ents.get(src), d = S.ents.get(dst);
  const nb = clone(db_ || { id: dst, sections: [] });
  for (const sec of sb?.sections || []) { let t = nb.sections.find(x => norm(x.title) === norm(sec.title)); if (!t) { t = { title: sec.title, entries: [] }; nb.sections.push(t); } for (const en of sec.entries) if (!t.entries.some(x => norm(x.text) === norm(en.text))) t.entries.push(en); t.entries.sort((a, b) => (a.n ?? -1) - (b.n ?? -1)); }
  const alias = [...new Set([...(d.alias || []), s.name, ...(s.alias || [])])].filter(a => norm(a) !== norm(d.name));
  const light = { ...d, alias, brief: d.brief || s.brief, status: d.status || s.status, sessions: [...new Set([...(d.sessions || []), ...(s.sessions || [])])].sort((a, b) => a - b), ...(s.photos?.length ? { photos: [...(d.photos || []), ...s.photos] } : {}), discovered: d.discovered !== false || s.discovered !== false, upd: Date.now() };
  const srcPortrait = s.portrait && !d.portrait ? await dbGet('blobs', s.portrait.id) : null;
  if (srcPortrait) light.portrait = { id: 'portrait-' + dst, thumb: s.portrait.thumb };
  await runBatch(['entities', 'bodies', 'links', 'events', 'pins', 'blobs'], '', async t => {
    if (srcPortrait) await t.put('blobs', { id: 'portrait-' + dst, blob: srcPortrait.blob, type: srcPortrait.type });
    await t.del('blobs', 'portrait-' + src);
    await t.put('entities', light); await t.put('bodies', nb); await t.del('entities', src); await t.del('bodies', src);
    for (const l of outL) { await t.del('links', l.k); if (l.to !== dst) await t.put('links', { ...l, k: dst + '|' + l.to + '|' + norm(l.label), from: dst }); }
    for (const l of inL) { await t.del('links', l.k); if (l.from !== dst) await t.put('links', { ...l, k: l.from + '|' + dst + '|' + norm(l.label), to: dst }); }
    for (const v of evs) await t.put('events', { ...v, ents: [...new Set(v.ents.map(x => x === src ? dst : x))] });
    for (const p of pins) await t.put('pins', { ...p, entityId: dst });
  });
}

const plain = t => String(t).replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g, '$2').replace(/\[\[([^\]|]+)\]\]/g, (m, a) => findEnt(a)?.name || a).replace(/\*\*/g, '');
function snippet(text, terms) {
  text = plain(text); const f = fold(text); let at = -1; for (const w of terms) { const i = f.indexOf(w); if (i >= 0 && (at < 0 || i < at)) at = i; }
  if (at < 0) return esc(text.slice(0, 160));
  const a = Math.max(0, at - 60), z = Math.min(text.length, at + 140); let s = esc(text.slice(a, z).replace(/\s+/g, ' '));
  for (const w of terms) s = s.replace(new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>');
  return (a > 0 ? '…' : '') + s + (z < text.length ? '…' : '');
}
route(/^\/cerca$/, async (_, q) => {
  const query = q.get('q') || ''; const terms = fold(query).split(/\s+/).filter(Boolean);
  setView(`<div class="pagehead"><h1>Ricerca</h1></div><div class="filters"><input type="search" id="fq" value="${esc(query)}" placeholder="Cerca in tutta la campagna…"></div><div id="fres"><p class="hint">Cerco…</p></div>`);
  $('#fq').onkeydown = e => { if (e.key === 'Enter') location.hash = '#/cerca?q=' + encodeURIComponent(e.target.value); };
  if (!terms.length) { $('#fres').innerHTML = '<p class="hint">Scrivi qualcosa da cercare: schede, riassunti di sessione, eventi, testi delle schede e documenti allegati.</p>'; return; }
  let dead = false; onCleanup(() => dead = true);
  const hit = t => { const f = fold(t); return terms.every(w => f.includes(w)); };
  const out = []; const LIM = 80;
  for (const e of S.ents.values()) if (terms.every(w => S.sidx.get(e.id).includes(norm(w)))) out.push({ k: 0, h: `<a class="erow" style="height:auto;padding:10px 4px" href="#/scheda/${encodeURIComponent(e.id)}">${badge(e.type)}<div class="main"><div class="t">${esc(e.name)}</div><div class="b">${esc(e.brief)}</div></div></a>` });
  const sec = []; const add = (kind, href, title, text) => { if (sec.length < LIM) sec.push({ k: 1, h: `<a class="erow" style="height:auto;padding:10px 4px;align-items:flex-start" href="${href}"><span class="badge">${kind}</span><div class="main"><div class="t">${esc(title)}</div><div class="b" style="white-space:normal">${snippet(text, terms)}</div></div></a>` }); };
  const render = (done) => { $('#fres').innerHTML = `<p class="hint">${out.length + sec.length} risultati${done ? '' : ' (sto ancora cercando…)'}</p><div class="card" style="padding:6px 16px">${[...out, ...sec].map(x => x.h).join('') || '<p class="empty">Nessun risultato.</p>'}</div>`; };
  render(false);
  const scan = (store, fn) => dbScan(store, v => { if (!dead) fn(v); });
  await scan('sbodies', v => { const docs = (v.docs || []).map(d => d.text).join('\n'); const t = v.summary + '\n' + docs; if (hit(t)) add('Sessione', '#/sessioni/' + v.n, `Sessione ${v.n}${sessOf(v.n)?.title ? ' · ' + sessOf(v.n).title : ''}`, t); }); if (dead) return; render(false);
  await scan('events', v => { const t = v.title + ' ' + v.text; if (hit(t)) add('Evento', '#/sessioni/' + v.n, `${v.title} (sess. ${v.n})`, v.text || v.title); }); if (dead) return;
  await scan('bodies', v => { const e = S.ents.get(v.id); if (!e) return; const t = v.sections.map(s => s.title + ': ' + s.entries.map(x => x.text).join(' ')).join('\n'); if (hit(t) || hit(e.name + ' ' + t)) add(TYPES[e.type], '#/scheda/' + encodeURIComponent(v.id), e.name, t); });
  if (!dead) render(true);
});

    if (drag.type === 'pinch' && ptr.size === 2) { const [a, b] = [...ptr.values()]; const r = stage.getBoundingClientRect(); const f = (drag.k0 * dist() / drag.d0) / st.k; zoomAt((a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top, f); return; }
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;

function planHtml(P) {
  let h = '';
  if (P.errors.length) h += `<div class="banner"><div>${P.errors.map(e => `<p class="e" style="margin:2px 0"><b>Errore:</b> ${esc(e)}</p>`).join('')}</div></div>`;
  if (P.warns.length) h += `<div class="card plan"><h3>Attenzione (${P.warns.length})</h3><ul>${P.warns.map(w => `<li class="w">${esc(w)}</li>`).join('')}</ul></div>`;
  if (P.errors.length) return h;
  const nNew = P.ents.filter(e => e.isNew).length, nUpd = P.ents.length - nNew;
  h += `<div class="card plan"><h2>Anteprima: cosa cambierà</h2><div class="stat"><div><b>${P.sess.length}</b><span>sessioni</span></div><div><b>${nNew}</b><span>schede nuove</span></div><div><b>${nUpd}</b><span>schede aggiornate</span></div><div><b>${P.events}</b><span>eventi</span></div><div><b>${P.pins.length}</b><span>segnaposto</span></div></div>`;
  if (P.sess.length) h += `<h3>Sessioni</h3><ul>${P.sess.map(s => `<li>Sessione ${s.n}${s.title ? ' — ' + esc(s.title) : ''} <small>${s.replaced ? 'esistente, verrà aggiornata' : 'nuova'} · riassunto di ${s.len} caratteri</small></li>`).join('')}</ul>`;
  if (P.general) h += `<h3>Riassunto generale</h3><p>Verrà riscritto (${P.general.oldLen} → ${P.general.newLen} caratteri). La versione attuale resta salvata nello storico.</p><details class="arc"><summary>Leggi il nuovo testo</summary>${prose(P.general.text)}</details>`;
  const lst = l => l.map(e => `<li>${badge(e.type || 'lore')} <b>${esc(e.name)}</b>${e.notes.length ? `<small>${e.notes.map(esc).join(' · ')}</small>` : '<small>solo apparizione in sessione</small>'}</li>`).join('');
  if (nNew) h += `<h3>Nuove schede (${nNew})</h3><ul>${lst(P.ents.filter(e => e.isNew))}</ul>`;
  if (nUpd) h += `<h3>Schede aggiornate (${nUpd})</h3><ul>${lst(P.ents.filter(e => !e.isNew))}</ul>`;
  if (P.events) h += `<h3>Cronologia</h3><p>${P.events} eventi per la sessione ${P.evSessions.join(', ')}${P.evSessions.length ? ' (quelli già presenti per le stesse sessioni vengono sostituiti)' : ''}.</p>`;
  if (P.pins.length) h += `<h3>Segnaposto</h3><ul>${P.pins.map(p => `<li><b>${esc(p.name || '?')}</b> su «${esc(p.map)}» <small>${p.moved ? 'spostato' : 'nuovo'} · x ${p.x.toFixed(1)} %, y ${p.y.toFixed(1)} %</small></li>`).join('')}</ul>`;
  if (P.misc.length) h += `<h3>Altro</h3><ul>${P.misc.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
  if (P.linksCount) h += `<p class="hint">${P.linksCount} collegamenti tra schede.</p>`;
  return h + `</div>`;
}
route(/^\/import$/, async () => {
  const hist = (await dbAll('imports')).reverse();
  setView(`<div class="pagehead"><h1>Importa aggiornamento</h1><div class="acts"><button class="btn" data-act="copyctx">Copia contesto per Claude</button></div></div><div class="orn"></div>
    <div class="card"><p class="lead" style="margin-top:0">Incolla qui la risposta di Claude (il JSON) oppure scegli il file. Prima di scrivere qualsiasi cosa vedrai un'anteprima.</p>
      <textarea class="big" id="jin" placeholder='{ "formato": "cronache/1", … }' spellcheck="false"></textarea>
      <div class="row" style="margin-top:10px"><button class="btn primary" data-act="analyze">Analizza</button><label class="btn ghost" style="cursor:pointer">…oppure scegli un file<input type="file" id="jfile" accept=".json,.txt,application/json" hidden></label></div></div>
    <div id="planbox"></div>
    <div class="card"><h2>Importazioni recenti</h2>${hist.length ? hist.map((h, i) => `<div class="spread" style="border-top:1px solid var(--line);padding:6px 0"><span>${esc(h.label)} <small>${fmtDate(h.ts)}</small></span>${i === 0 ? '<button class="btn sm" data-act="undo">Annulla questa importazione</button>' : ''}</div>`).join('') + '<p class="hint">Annullare ripristina le schede e i dati toccati da quell\'importazione allo stato di prima. Le modifiche manuali fatte nel frattempo sulle stesse schede andrebbero perse.</p>' : '<p class="hint">Nessuna importazione ancora.</p>'}</div>`);
  let plan = null;
  $('#jfile').onchange = async e => { const f = e.target.files[0]; if (f) { $('#jin').value = await f.text(); analyze(); } };
  async function analyze() {
    const v = $('#jin').value; if (!v.trim()) { toast('Incolla prima il JSON', 'err'); return; }
    plan = await planImport(v); $('#planbox').innerHTML = planHtml(plan) + (!plan.errors.length ? `<div class="row" style="margin:6px 0 20px"><button class="btn primary" data-act="confirm">Conferma e importa</button><button class="btn ghost" data-act="cancel">Annulla</button></div>` : '');
    $('#planbox').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  setActs({
    copyctx: copyContextFlow, analyze,
    cancel: () => { plan = null; $('#planbox').innerHTML = ''; },
    confirm: async a => {
      if (!plan || plan.errors.length) return; a.disabled = true;
      try { await applyImport(plan); } catch (e) { a.disabled = false; throw new Error('Importazione non riuscita, non è stato modificato nulla: ' + e.message); }
      toast('Importazione completata'); const n = plan.sess.length ? plan.sess[plan.sess.length - 1].n : null; location.hash = n != null ? '#/sessioni/' + n : '#/';
    },
    undo: async () => { if (!await ask('Annullare l\'ultima importazione?', { ok: 'Annulla importazione', danger: true })) return; await undoLastImport(); toast('Importazione annullata'); rerender(); }
  });
});

route(/^\/backup$/, async () => {
  const lastBk = getMeta('lastBackup', 0); let usage = null;
  try { const as = await claude.use('assets'); if (as) usage = (await as.list()).usage; } catch { }
  setView(`<div class="pagehead"><h1>Backup e dati</h1></div><div class="orn"></div>
    <div class="card"><h2>Salva una copia</h2><p>I dati vivono in questo browser (funzionano anche offline). Un backup è un file che puoi tenere dove vuoi e ricaricare quando serve.</p>
      <div class="row"><button class="btn primary" data-act="bkFull">Backup completo (con mappe)</button><button class="btn" data-act="bkData">Solo dati (leggero)</button></div>
      <p class="hint">Ultimo backup: ${lastBk ? fmtDate(lastBk) : 'mai'}. Il «solo dati» non include le immagini delle mappe, che di solito cambiano di rado.</p></div>
    <div class="card"><h2>Ripristina da un backup</h2><p>Sostituisce <b>tutto</b> il contenuto attuale con quello del file.</p><label class="btn" style="cursor:pointer">Scegli il file di backup…<input type="file" id="rfile" accept=".json,application/json" hidden></label></div>
    <div class="card"><h2>Dove sono i dati</h2><p class="hint">I dati e le immagini sono salvati in questo browser, su questo dispositivo${usage ? ': <b>' + fmtSize(usage.bytes) + '</b> su ' + fmtSize(usage.maxBytes) + ' (' + usage.files + ' file)' : ''}. Le modifiche fatte qui restano su questo dispositivo: fai un backup ogni tanto. Gli aggiornamenti della campagna arrivano come nuova versione dei dati (il sito te lo propone).</p></div>
    <div class="card"><h2>Zona pericolosa</h2><p>Cancella tutto (schede, sessioni, mappe, cronologia). Fai prima un backup.</p><button class="btn danger" data-act="wipe">Svuota tutto</button></div>`);
  $('#rfile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    if (!await ask(`Ripristinare il backup **${f.name}**? Il contenuto attuale verrà **sostituito**.`, { danger: true, ok: 'Ripristina' })) { e.target.value = ''; return; }
    try { const r = await restoreBackup(await f.text()); toast('Backup ripristinato' + (r.images ? '' : ' (le immagini delle mappe esistenti sono rimaste)')); location.hash = '#/'; }
    catch (err) { toast(err.message, 'err'); }
  };
  setActs({
    bkFull: () => doBackup(true).then(rerender), bkData: () => doBackup(false).then(rerender),
    wipe: async () => {
      const r = await formDlg({ title: 'Svuota tutto', ok: 'Cancella definitivamente', fields: [{ k: 't', label: 'Scrivi CANCELLA per confermare', req: true }] });
      if (!r || r.t.trim() !== 'CANCELLA') { if (r) toast('Conferma non corretta', 'err'); return; } await wipeAll(); toast('Tutto cancellato'); location.hash = '#/';
    }
  });
});

/* ---------- ricerca rapida in alto ---------- */
function setupQuickSearch() {
  const qi = $('#q'), qr = $('#qres');
  const close = () => qr.classList.remove('on');
  qi.addEventListener('input', () => {
    const terms = norm(qi.value).split(' ').filter(Boolean); if (!terms.length) return close();
    const ents = [...S.ents.values()].filter(e => terms.every(w => S.sidx.get(e.id).includes(w))).sort((a, b) => (norm(b.name).startsWith(terms[0]) - norm(a.name).startsWith(terms[0])) || a.name.localeCompare(b.name)).slice(0, 8);
    const ss = S.sess.filter(s => terms.every(w => norm(s.title + ' ' + s.brief + ' ' + s.n).includes(w))).slice(0, 3);
    const ms = S.maps.filter(m => terms.every(w => norm(m.name).includes(w))).slice(0, 3);
    const qh = (t, l) => l.length ? `<div class="qh">${t}</div>` : '';
    qr.innerHTML = qh('Schede', ents) + ents.map(e => `<a href="#/scheda/${encodeURIComponent(e.id)}">${badge(e.type)} <span>${esc(e.name)}</span></a>`).join('') + qh('Sessioni', ss) + ss.map(s => `<a href="#/sessioni/${s.n}"><span class="badge">Sess.</span> <span>${s.n}. ${esc(s.title)}</span></a>`).join('') + qh('Mappe', ms) + ms.map(m => `<a href="#/mappe/${encodeURIComponent(m.id)}"><span class="badge">Mappa</span> <span>${esc(m.name)}</span></a>`).join('')
      + `<a href="#/cerca?q=${encodeURIComponent(qi.value)}"><span class="mute">Cerca «${esc(qi.value)}» in tutti i testi ↵</span></a>`;
    qr.classList.add('on');
  });
  qi.addEventListener('keydown', e => { if (e.key === 'Enter' && qi.value.trim()) { location.hash = '#/cerca?q=' + encodeURIComponent(qi.value.trim()); close(); qi.blur(); } else if (e.key === 'Escape') { close(); qi.blur(); } });
  qr.addEventListener('click', () => { close(); qi.value = ''; });
  const top = $('.top'), btn = $('#srchBtn');
  const openS = () => { top.classList.add('srchopen'); qi.focus(); qi.select(); };
  const closeS = () => { top.classList.remove('srchopen'); close(); };
  btn.addEventListener('click', e => { e.preventDefault(); top.classList.contains('srchopen') ? closeS() : openS(); });
  qr.addEventListener('click', closeS);
  qi.addEventListener('keydown', e => { if (e.key === 'Escape' || e.key === 'Enter') closeS(); });
  document.addEventListener('click', e => { if (!e.target.closest('.srch') && !e.target.closest('#srchBtn')) closeS(); });
  document.addEventListener('keydown', e => { if ((e.key === '/' || (e.key.toLowerCase() === 'k' && (e.ctrlKey || e.metaKey))) && !/input|textarea|select/i.test(document.activeElement?.tagName || '')) { e.preventDefault(); openS(); } });
}

/* ---------- tema e avvio ---------- */
function applyTheme(t) { document.documentElement.dataset.theme = t; $('#themeBtn').textContent = t === 'dark' ? '☀' : '☾'; }
async function checkAccess(PERM) {
  const why = [];
  try { const u = await claude.use('user'); if (u && !(await u.canEdit())) why.push('questo account può solo consultare la pagina (servono i permessi di modifica sull\'artifact)'); } catch { }
  if (!CASSETS) why.push('il caricamento di immagini (mappe, foto, ritratti) non è abilitato');
  try { if (PERM) { const st = await PERM.state(); const bad = Object.entries(st).filter(([k, v]) => ['db', 'assets', 'downloads'].includes(k) && v !== 'granted').map(([k, v]) => k + ': ' + v); if (bad.length) why.push('permessi non concessi (' + bad.join(', ') + ')'); } } catch { }
  const old = $('#access'); if (old) old.remove();
  if (!why.length) return;
  const d = document.createElement('div'); d.id = 'access'; d.className = 'card'; d.style.cssText = 'margin:12px max(16px,env(safe-area-inset-left,0px));border-color:var(--warn)';
  d.innerHTML = '<b>Alcune modifiche potrebbero non funzionare:</b> ' + esc(why.join('; ')) + '. ' + (PERM ? '<button class="btn sm" id="accBtn">Gestisci permessi</button>' : '');
  $('#view').before(d); const bt = $('#accBtn'); if (bt) bt.onclick = async () => { try { await PERM.manage(); } catch { } location.reload(); };
}
(async function boot() {
  applyTheme(pref('theme', matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  $('#themeBtn').onclick = () => { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; setPref('theme', t); applyTheme(t); };
  try {
    let PERM = null; try { PERM = await claude.use('permissions'); if (PERM) await PERM.request(['db', 'assets', 'downloads']); } catch { }
    await openDB(); await loadCaches(); checkAccess(PERM);
  } catch (e) {
    setView(`<div class="card"><h2>Impossibile aprire i dati</h2><p>${esc(e.message || e)}</p><p class="hint">Ricarica la pagina; se il problema resta, apri il sito almeno una volta con internet attivo.</p></div>`); return;
  }
  setupQuickSearch(); addEventListener('hashchange', navigate); navigate();
  window.__cronache = { S, planImport, applyImport, buildContext, runBatch, dbAll, dbGet, loadCaches, processImage, rerender, dmTool };
})();
